name: Deploy to Azure Web App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AZURE_WEBAPP_NAME: deadlocksim
  AZURE_WEBAPP_RESOURCE_GROUP: deadlocksim-rg
  TARGET: x86_64-unknown-linux-musl

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Test
        run: cargo test --locked

      - name: Build static release binary
        run: cargo build --release --locked --target "$TARGET"

      - name: Assemble deployment package
        run: |
          mkdir -p package
          cp "target/$TARGET/release/deadlock-sim" startup.sh package/
          cp -r data package/data
          chmod +x package/deadlock-sim package/startup.sh

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Configure webapp settings
        run: |
          az webapp config set \
            --resource-group $AZURE_WEBAPP_RESOURCE_GROUP \
            --name $AZURE_WEBAPP_NAME \
            --startup-file "bash startup.sh"

          # The package is prebuilt: skip the Oryx build.
          az webapp config appsettings set \
            --resource-group $AZURE_WEBAPP_RESOURCE_GROUP \
            --name $AZURE_WEBAPP_NAME \
            --settings \
              SCM_DO_BUILD_DURING_DEPLOYMENT=false \
              WEBSITE_HEALTHCHECK_MAXPINGFAILURES=5

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          resource-group-name: ${{ env.AZURE_WEBAPP_RESOURCE_GROUP }}
          package: package
